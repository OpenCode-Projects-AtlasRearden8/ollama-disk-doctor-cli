[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-disk-doctor"
version = "0.1.0"
description = "Scan Ollama and OpenAI-compatible cache model directories, report disk usage, and print a move-or-delete plan. Pure stdlib, offline."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["ollama", "local-ai", "disk-usage", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.scripts]
ollama-disk-doctor = "ollama_disk_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["ollama_disk_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
